<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SUBLEVEL 7</title>
<style>
  :root{ --void:#0a0e12; --steel:#1b242c; --dust:#c8cbc4;
         --sodium:#f2b544; --rust:#c4462c; --acid:#7fb069; --teal:#4fa3a3; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--void);
    font-family:"Bahnschrift","DIN Alternate","Helvetica Neue",Arial,sans-serif;
    color:var(--dust);-webkit-user-select:none;user-select:none;touch-action:none}
  #view{display:block;width:100vw;height:100vh;image-rendering:pixelated;cursor:none}

  #hud{position:fixed;inset:0;pointer-events:none}
  .corner{position:absolute;bottom:18px;display:flex;align-items:flex-end;gap:14px}
  #left{left:20px}
  #right{right:20px;flex-direction:row-reverse;text-align:right}
  .num{font-size:44px;line-height:.82;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .tag{font-size:11px;letter-spacing:.14em;color:#6d7880;margin-top:6px}
  #hpnum{color:var(--sodium)} #hpnum.hurt{color:var(--rust)}
  #ammonum.empty{color:var(--rust)}
  #hpbar{width:7px;height:74px;background:#141b21;position:relative;overflow:hidden}
  #hpfill{position:absolute;bottom:0;left:0;right:0;background:var(--sodium);transition:height .12s}
  #top{position:absolute;top:16px;left:0;right:0;text-align:center;font-size:12px;letter-spacing:.28em;color:#5d6970}
  #top b{color:var(--dust);font-weight:600}
  #map{position:absolute;top:16px;right:20px;opacity:.75}
  #scoreboard{position:absolute;top:154px;right:20px;text-align:right;font-size:11px;line-height:1.7;
    color:#8b959c;letter-spacing:.04em;opacity:.9}
  #scoreboard .me{color:var(--sodium);font-weight:700}
  #hit{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 35%,rgba(196,70,44,.55) 100%);opacity:0;transition:opacity .3s}
  #hitdir{position:absolute;inset:0;opacity:0;transition:opacity .15s ease-out;transform-origin:50% 50%}
  #hitdirArrow{position:absolute;top:9vmin;left:50%;width:9vmin;height:9vmin;--pop:1;
    transform:translateX(-50%) perspective(38vmin) rotateX(58deg);transform-style:preserve-3d}
  #hitdirArrow .shaft{position:absolute;left:27%;top:42%;width:46%;height:58%;
    background:linear-gradient(0deg,#ff9d7e 0%,var(--rust) 75%);
    box-shadow:0 0 2.2vmin rgba(196,70,44,.85)}
  #hitdirArrow .head{position:absolute;left:0;top:0;width:100%;height:46%;
    background:linear-gradient(0deg,#ff9d7e 0%,var(--rust) 60%);
    clip-path:polygon(50% 0%,0% 100%,100% 100%);
    filter:drop-shadow(0 -.4vmin .5vmin rgba(0,0,0,.55))}
  #gear{position:absolute;top:14px;left:18px;pointer-events:auto;background:none;border:1px solid #2b3740;
    color:#7b858c;font:inherit;font-size:11px;letter-spacing:.18em;padding:7px 13px;cursor:pointer}
  #gear:hover{color:var(--dust);border-color:#4a5860}

  #veil{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(10,14,18,.94);text-align:center;padding:24px;overflow-y:auto}
  #veil.gone{display:none}
  #title{font-size:clamp(34px,8vw,74px);font-weight:700;letter-spacing:-.04em;line-height:.88}
  #title span{display:block;font-size:.34em;letter-spacing:.42em;color:var(--rust);font-weight:600;margin-bottom:14px}
  #blurb{margin-top:16px;font-size:13.5px;line-height:1.95;color:#7b858c;max-width:40ch}
  kbd{background:#1b242c;color:var(--dust);padding:1px 6px;font:inherit;font-size:12px;border-bottom:2px solid #000}
  #go{margin-top:24px;pointer-events:auto;border:0;background:var(--sodium);color:#0a0e12;
    font:inherit;font-size:15px;font-weight:700;letter-spacing:.18em;padding:15px 40px;cursor:pointer}
  #go:hover{background:#fff}
  #go:disabled{background:#39454d;color:#6d7880;cursor:default}
  #go:focus-visible,#gear:focus-visible{outline:3px solid var(--acid);outline-offset:3px}
  #quit{margin-top:12px;pointer-events:auto;border:1px solid var(--rust);background:none;color:var(--rust);
    font:inherit;font-size:13px;font-weight:600;letter-spacing:.16em;padding:12px 34px;cursor:pointer}
  #quit:hover{background:var(--rust);color:#0a0e12}
  #quit:focus-visible{outline:3px solid var(--acid);outline-offset:3px}
  #score{margin-top:16px;font-size:13px;color:#5d6970;letter-spacing:.1em}

  #cfg{margin-top:24px;width:min(380px,92vw);text-align:left;border-top:1px solid #222c34;padding-top:18px}
  .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px;font-size:13px}
  .row em{font-style:normal;color:#6d7880;font-size:12px;letter-spacing:.06em}
  .row b{color:var(--sodium);font-weight:600;font-variant-numeric:tabular-nums}
  .field{margin-bottom:18px}
  .hint{font-size:11px;color:#59636a;line-height:1.75;margin-top:6px}
  input[type=range]{width:100%;-webkit-appearance:none;appearance:none;background:none;height:20px;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:2px;background:#2b3740}
  input[type=range]::-moz-range-track{height:2px;background:#2b3740}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;background:var(--sodium);margin-top:-6px;border-radius:0}
  input[type=range]::-moz-range-thumb{width:14px;height:14px;background:var(--sodium);border:0;border-radius:0}
  .seg{display:flex;border:1px solid #2b3740}
  .seg button{flex:1;background:none;border:0;color:#7b858c;font:inherit;font-size:12px;padding:11px 4px;cursor:pointer;letter-spacing:.08em}
  .seg button[aria-pressed=true]{background:var(--steel);color:var(--dust)}
  .seg button:not(:last-child){border-right:1px solid #2b3740}
  input[type=text]{width:100%;background:#12181d;border:1px solid #2b3740;color:var(--dust);
    font:inherit;font-size:13px;padding:10px 11px;margin-top:8px;letter-spacing:.02em}
  input[type=text]:focus{outline:1px solid var(--acid)}
  #netrow{display:flex;gap:8px;margin-top:8px}
  #netrow button{flex:none;border:1px solid var(--sodium);background:none;color:var(--sodium);
    font:inherit;font-size:12px;padding:0 16px;cursor:pointer;letter-spacing:.1em}
  #netrow button:hover{background:var(--sodium);color:#0a0e12}
  #netstatus{color:var(--teal);font-size:12px;margin-top:10px;letter-spacing:.04em}
  #playercount{margin-top:2px}
  #startBtn{margin-top:10px;border:0;background:var(--sodium);color:#0a0e12;font:inherit;font-size:13px;
    font-weight:700;letter-spacing:.14em;padding:11px 26px;cursor:pointer}
  #startBtn:hover{background:#fff}
  #startBtn:disabled{background:#39454d;color:#6d7880;cursor:default}

  #touch{position:fixed;inset:0;display:none;pointer-events:none}
  body.touch #touch{display:block}
  #stick{position:absolute;left:26px;bottom:26px;width:118px;height:118px;border:2px solid #2b3740;border-radius:50%;pointer-events:auto}
  #knob{position:absolute;left:39px;top:39px;width:40px;height:40px;border-radius:50%;background:#2b3740}
  #fire{position:absolute;right:26px;bottom:26px;width:96px;height:96px;border-radius:50%;
    border:2px solid var(--rust);background:rgba(196,70,44,.18);pointer-events:auto}
</style>
</head>
<body class="solo">
<canvas id="view"></canvas>

<div id="hud">
  <div id="hit"></div>
  <div id="hitdir"><div id="hitdirArrow"><div class="shaft"></div><div class="head"></div></div></div>
  <button id="gear">設定</button>
  <div id="top">区画 <b id="wave">1</b> &nbsp;·&nbsp; 残り <b id="left_n">0</b> &nbsp;·&nbsp; <b id="pts">0</b></div>
  <canvas id="map" width="132" height="132"></canvas>
  <div id="scoreboard"></div>
  <div class="corner" id="left">
    <div id="hpbar"><div id="hpfill" style="height:100%"></div></div>
    <div><div class="num" id="hpnum">100</div><div class="tag">体力</div></div>
  </div>
  <div class="corner" id="right">
    <div><div class="num" id="ammonum">12</div><div class="tag">装弾 / <span id="reserve">∞</span></div></div>
  </div>
</div>

<div id="touch">
  <div id="stick"><div id="knob"></div></div>
  <div id="fire"></div>
</div>

<div id="veil">
  <h1 id="title"><span>地下七層</span>SUBLEVEL 7</h1>
  <p id="blurb"></p>
  <button id="go">進入する</button>
  <button id="quit" style="display:none">切断する</button>
  <div id="score"></div>

  <div id="cfg">
    <div class="field" id="modefield">
      <div class="row"><em>モード</em></div>
      <div class="seg">
        <button id="g_solo" aria-pressed="true">ソロ掃討</button>
        <button id="g_online" aria-pressed="false">対人（オンライン）</button>
      </div>
    </div>
    <div class="field" id="sensfield">
      <div class="row"><em>感度</em><b id="v_sens">1.00</b></div>
      <input type="range" id="s_sens" min="0.15" max="3" step="0.05" value="1">
      <p class="hint">視点は常に画面中央固定。マウスの動きで振り向く。</p>
    </div>
    <div class="field" id="netfield" style="display:none">
      <div class="row"><em>サーバー接続</em></div>
      <input type="text" id="srv" placeholder="ws://192.168.1.5:8080" autocomplete="off">
      <div id="netrow">
        <input type="text" id="room" placeholder="ルームコード" autocomplete="off" style="margin-top:0">
        <button id="connectBtn">接続</button>
      </div>
      <div class="row" style="margin-top:8px">
        <em>最大人数（部屋を作る側のみ有効）</em>
        <input type="number" id="maxp" min="2" max="8" value="8" style="width:52px;background:#12181d;border:1px solid #2b3740;color:var(--dust);font:inherit;font-size:13px;padding:4px 6px">
      </div>
      <p class="hint">同じサーバーアドレスとルームコードを、対戦する全員（最大8人）に入力する。最初に入室した人がホストとなり、人数がそろったら「対戦開始」を押す。</p>
      <p id="netstatus">未接続</p>
      <div id="lobby" style="display:none">
        <p id="playercount" class="hint"></p>
        <button id="startBtn" style="display:none">対戦開始</button>
      </div>
    </div>
  </div>
</div>

<script>
'use strict';
const cv = document.getElementById('view'), ctx = cv.getContext('2d');
const el = id => document.getElementById(id);
const isTouch = matchMedia('(hover:none)').matches || 'ontouchstart' in window;
if (isTouch) document.body.classList.add('touch');
const SCALE = isTouch ? 0.45 : 0.62;
let W = 0, H = 0;
const CFG = { sens: 1, mode: 'solo', target: 5 };

/* ============ seeded rng ============ */
function mulberry32(seed){
  let s = seed >>> 0;
  return function(){
    s = (s + 0x6D2B79F5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ============ maze ============ */
const N = 25;
let grid = [];
function buildMaze(rng){
  rng = rng || Math.random;
  grid = Array.from({length:N}, () => Array(N).fill(1));
  const stack = [[1,1]]; grid[1][1] = 0;
  while (stack.length){
    const [x,y] = stack[stack.length-1];
    const opts = [[2,0],[-2,0],[0,2],[0,-2]]
      .map(([dx,dy]) => [x+dx, y+dy, x+dx/2, y+dy/2])
      .filter(([nx,ny]) => nx>0 && ny>0 && nx<N-1 && ny<N-1 && grid[ny][nx]===1);
    if (!opts.length){ stack.pop(); continue; }
    const [nx,ny,mx,my] = opts[(rng()*opts.length)|0];
    grid[my][mx] = 0; grid[ny][nx] = 0; stack.push([nx,ny]);
  }
  for (let y=2; y<N-2; y++) for (let x=2; x<N-2; x++)
    if (grid[y][x]===1 && rng()<0.42) grid[y][x] = 0;
  for (let y=0; y<N; y++) for (let x=0; x<N; x++)
    if (grid[y][x]===1) grid[y][x] = (x===0||y===0||x===N-1||y===N-1) ? 1 : (rng()<0.22 ? 3 : (rng()<0.3 ? 2 : 1));
  grid[1][1] = 0; grid[1][2] = 0; grid[2][1] = 0;
}
const solid = (x,y) => x<0||y<0||x>=N||y>=N || grid[y|0][x|0] > 0;
const WALLC = {1:[142,151,158], 2:[168,128,104], 3:[116,142,136]};
function freeSpot(rng, minFrom){
  rng = rng || Math.random;
  let x, y, t = 0;
  do {
    x = 1 + rng()*(N-2); y = 1 + rng()*(N-2); t++;
  } while (t < 600 && (solid(x,y) || (minFrom && minFrom.some(p => Math.hypot(x-p.x, y-p.y) < 7))));
  return {x, y};
}

/* ============ sprites ============ */
const GUN = '#20262b', GUN_HI = '#3a444c'; // shared weapon colors, same for every kind
function makeSprite(body, head, eye, pose, facing){
  const s = document.createElement('canvas'); s.width = s.height = 64;
  const c = s.getContext('2d');
  if (!pose){
    if (facing === 'back'){
      // seen from behind: arms are shortened to the upper arm only (the forearms
      // are bent forward, holding the gun out of sight), and the rifle's stock
      // peeks past the head, tucked into the shoulder like an over-the-shoulder aim
      c.fillStyle = body; c.fillRect(24,18,16,30);
      c.fillRect(18,22,6,11); c.fillRect(40,22,6,11);
      c.fillRect(25,48,5,14); c.fillRect(34,48,5,14);
      c.fillStyle = head; c.fillRect(22,4,20,16);
      c.fillStyle = GUN; c.fillRect(41,11,6,10);
      c.fillStyle = GUN_HI; c.fillRect(41,11,2,10);
      c.fillStyle = 'rgba(0,0,0,.35)'; c.fillRect(27,20,10,16);
      c.fillStyle = 'rgba(0,0,0,.28)'; c.fillRect(24,18,5,30); c.fillRect(25,48,5,14);
    } else if (facing === 'bdiag'){
      // three-quarter back view (halfway between back and side): still mostly
      // a back silhouette, but turned enough that more of the gun's length
      // shows past the shoulder than the straight-back pose does
      c.fillStyle = body;
      c.fillRect(25,18,15,30);
      c.fillRect(19,22,5,8); c.fillRect(39,22,6,10);
      c.fillRect(25,48,6,14); c.fillRect(34,49,6,13);
      c.fillStyle = head; c.fillRect(22,4,20,16);
      c.fillStyle = GUN; c.fillRect(41,14,5,9); c.fillRect(44,22,10,4);
      c.fillStyle = GUN_HI; c.fillRect(41,14,2,9); c.fillRect(52,21,3,3);
      c.fillStyle = 'rgba(0,0,0,.35)'; c.fillRect(28,20,9,16);
      c.fillStyle = 'rgba(0,0,0,.28)'; c.fillRect(25,18,5,30); c.fillRect(25,48,5,14);
    } else if (facing === 'side'){
      // seen from the side: narrower profile, one leg forward. Both hands are
      // brought together on the gun and hold it straight out in the facing
      // direction, so the long barrel silhouette makes the side view instantly
      // recognizable next to the compact front/back poses.
      c.fillStyle = body;
      c.fillRect(28,18,12,30);
      c.fillRect(24,48,7,14); c.fillRect(34,50,7,12);
      c.fillRect(30,20,6,9);
      c.fillRect(34,24,13,6);
      c.fillStyle = head; c.fillRect(26,4,16,16);
      c.fillStyle = eye; c.fillRect(34,10,4,4);
      c.fillStyle = GUN; c.fillRect(26,25,8,5);
      c.fillRect(36,24,22,4);
      c.fillStyle = GUN_HI; c.fillRect(55,23,4,3);
      c.fillStyle = 'rgba(0,0,0,.28)'; c.fillRect(28,18,4,30); c.fillRect(34,50,4,12);
    } else if (facing === 'fdiag'){
      // three-quarter front view (halfway between front and side): the near
      // arm/leg lead the way like the side pose, the far arm tucks in, and
      // the gun angles diagonally forward instead of pointing straight down
      // the barrel (front) or straight out (side)
      c.fillStyle = body;
      c.fillRect(25,18,15,30);
      c.fillRect(20,23,4,7); c.fillRect(38,23,6,9);
      c.fillRect(29,30,6,7); c.fillRect(35,30,7,7);
      c.fillRect(24,48,6,14); c.fillRect(34,49,6,13);
      c.fillStyle = head; c.fillRect(23,4,18,16);
      c.fillStyle = eye; c.fillRect(25,10,3,4); c.fillRect(34,10,4,4);
      c.fillStyle = GUN; c.fillRect(30,32,10,6); c.fillRect(40,29,10,4);
      c.fillStyle = GUN_HI; c.fillRect(30,26,2,7); c.fillRect(48,28,3,3);
      c.fillRect(30,26,6,7);
      c.fillStyle = 'rgba(0,0,0,.28)'; c.fillRect(25,18,5,30); c.fillRect(24,48,5,14);
    } else {
      // seen from the front: both arms bend inward to a shared grip at the
      // centre of the chest. Pointed straight at the camera the gun mostly
      // foreshortens away, reading as a compact hand block with a short
      // barrel poking up — deliberately narrower than the side silhouette.
      c.fillStyle = body; c.fillRect(24,18,16,30);
      c.fillRect(18,23,6,9); c.fillRect(40,23,6,9);
      c.fillRect(22,30,8,7); c.fillRect(34,30,8,7);
      c.fillRect(25,48,5,14); c.fillRect(34,48,5,14);
      c.fillStyle = head; c.fillRect(22,4,20,16);
      c.fillStyle = eye; c.fillRect(26,10,4,4); c.fillRect(34,10,4,4);
      c.fillStyle = GUN; c.fillRect(26,33,12,6);
      c.fillRect(29,26,6,8);
      c.fillStyle = GUN_HI; c.fillRect(29,26,2,8);
      c.fillStyle = 'rgba(0,0,0,.28)'; c.fillRect(24,18,5,30); c.fillRect(25,48,5,14);
    }
  } else if (pose === 'crouch'){
    if (facing === 'back'){
      c.fillStyle = body;
      c.fillRect(22,28,20,20);
      c.fillRect(14,32,7,8); c.fillRect(43,32,7,8);
      c.fillRect(19,47,9,8);  c.fillRect(36,47,9,8);
      c.fillRect(16,54,8,8);  c.fillRect(40,54,8,8);
      c.fillStyle = head; c.fillRect(21,15,22,15);
      c.fillStyle = GUN; c.fillRect(39,14,6,9);
      c.fillStyle = GUN_HI; c.fillRect(39,14,2,9);
      c.fillStyle = 'rgba(0,0,0,.35)'; c.fillRect(25,30,14,14);
      c.fillStyle = 'rgba(0,0,0,.28)'; c.fillRect(22,28,5,20); c.fillRect(16,54,4,8);
    } else if (facing === 'bdiag'){
      c.fillStyle = body;
      c.fillRect(23,28,18,20);
      c.fillRect(15,32,6,8); c.fillRect(42,32,7,9);
      c.fillRect(20,47,9,8); c.fillRect(35,47,9,8);
      c.fillRect(17,54,8,8); c.fillRect(39,54,8,8);
      c.fillStyle = head; c.fillRect(21,15,22,15);
      c.fillStyle = GUN; c.fillRect(38,14,5,9); c.fillRect(41,23,10,4);
      c.fillStyle = GUN_HI; c.fillRect(38,14,2,9); c.fillRect(49,22,3,3);
      c.fillStyle = 'rgba(0,0,0,.35)'; c.fillRect(26,30,14,14);
      c.fillStyle = 'rgba(0,0,0,.28)'; c.fillRect(23,28,5,20); c.fillRect(17,54,4,8);
    } else if (facing === 'side'){
      c.fillStyle = body;
      c.fillRect(26,28,14,20);
      c.fillRect(22,47,9,8); c.fillRect(34,49,8,7);
      c.fillRect(19,54,8,8); c.fillRect(37,55,7,7);
      c.fillRect(28,32,6,8);
      c.fillRect(32,36,9,5);
      c.fillStyle = head; c.fillRect(24,17,18,14);
      c.fillStyle = eye; c.fillRect(34,22,4,4);
      c.fillStyle = GUN; c.fillRect(24,34,7,5);
      c.fillRect(33,35,18,4);
      c.fillStyle = GUN_HI; c.fillRect(49,34,4,3);
      c.fillStyle = 'rgba(0,0,0,.28)'; c.fillRect(26,28,4,20); c.fillRect(19,54,4,8);
    } else if (facing === 'fdiag'){
      c.fillStyle = body;
      c.fillRect(23,28,18,20);
      c.fillRect(16,32,6,8); c.fillRect(41,32,7,9);
      c.fillRect(21,38,6,7); c.fillRect(37,38,7,7);
      c.fillRect(20,47,9,8); c.fillRect(35,47,9,8);
      c.fillRect(17,54,8,8); c.fillRect(39,54,8,8);
      c.fillStyle = head; c.fillRect(20,15,22,15);
      c.fillStyle = eye; c.fillRect(23,21,3,4); c.fillRect(32,21,4,4);
      c.fillStyle = GUN; c.fillRect(26,41,14,6); c.fillRect(37,36,9,4);
      c.fillStyle = GUN_HI; c.fillRect(26,34,2,8); c.fillRect(44,35,3,3);
      c.fillRect(26,34,6,8);
      c.fillStyle = 'rgba(0,0,0,.28)'; c.fillRect(23,28,5,20); c.fillRect(17,54,4,8);
    } else {
      // compressed, wide-legged crouching pose — head dips low, knees bend outward,

      c.fillStyle = body;

  g.gain.setValueAtTime(vol, actx.currentTime);

function rotate(a){
  const c = Math.cos(a), s = Math.sin(a);
  const dx = P.dx*c - P.dy*s; P.dy = P.dx*s + P.dy*c; P.dx = dx;
  const px = P.px*c - P.py*s; P.py = P.px*s + P.py*c; P.px = px;
}
function addPitch(dy){
  const maxP = H * 0.5;
  pitch = Math.max(-maxP, Math.min(maxP, pitch - dy));
}
addEventListener('mousemove', e => {
  if (document.pointerLockElement === cv){
    rotate(e.movementX * 0.0022 * CFG.sens);
    addPitch(e.movementY * 1.1 * CFG.sens);
  }
});
cv.addEventListener('mousedown', e => { if (e.button === 0) shoot(); });
document.addEventListener('pointerlockchange', () => {
  if (alive && !isTouch && document.pointerLockElement !== cv) pause();
});

// touch
let move = {x:0, y:0}, lookId = null, stickId = null, firing = false;
const stick = el('stick'), knob = el('knob');
stick.addEventListener('touchstart', e => { stickId = e.changedTouches[0].identifier; e.preventDefault(); }, {passive:false});
el('fire').addEventListener('touchstart', e => { firing = true; shoot(); e.preventDefault(); }, {passive:false});
el('fire').addEventListener('touchend', () => firing = false);
addEventListener('touchmove', e => {
  for (const t of e.changedTouches){
    if (t.identifier === stickId){
      const r = stick.getBoundingClientRect();
      const dx = t.clientX - (r.left + r.width/2), dy = t.clientY - (r.top + r.height/2);
      const d = Math.hypot(dx,dy) || 1, m = Math.min(1, d/52);
      move.x = dx/d*m; move.y = -dy/d*m;
      knob.style.transform = `translate(${dx/d*m*38}px,${dy/d*m*38}px)`;
    } else if (t.identifier === lookId){
      rotate((t.clientX - t._px) * 0.006 * CFG.sens);
      addPitch((t.clientY - t._py) * 0.9 * CFG.sens);
      t._px = t.clientX; t._py = t.clientY;
    }
  }
  e.preventDefault();
}, {passive:false});
addEventListener('touchstart', e => {
  for (const t of e.changedTouches)
    if (lookId === null && stickId !== t.identifier && t.clientX > innerWidth*0.35){ lookId = t.identifier; t._px = t.clientX; t._py = t.clientY; }
}, {passive:true});
addEventListener('touchend', e => {
  for (const t of e.changedTouches){
    if (t.identifier === stickId){ stickId = null; move.x = move.y = 0; knob.style.transform = ''; }
    if (t.identifier === lookId) lookId = null;
  }
});

/* ============ aiming / targets ============ */
function targetsFor(){ return CFG.mode === 'online' ? [...REMOTES.values()].filter(r => !r.dead) : foes; }
function project(f){
  const inv = 1 / (P.px*P.dy - P.dx*P.py);
  const rx = f.x - P.x, ry = f.y - P.y;
  const tx = inv * (P.dy*rx - P.dx*ry);
  const ty = inv * (-P.py*rx + P.px*ry);
  if (ty <= 0.2) return null;
  const hFull = Math.abs(H/ty) * 0.92;
  const pose = getPose(f);
  const w = hFull * (pose === 'slide' ? SLIDE_WIDTH_MULT : 0.6);
  const h = pose === 'slide' ? hFull * SLIDE_VIS_SCALE : pose === 'crouch' ? hFull * CROUCH_VIS_SCALE : hFull;
  // Jumping actually lifts the whole body off the ground, so it still shifts the sprite
  // (mine and theirs). Crouching/sliding do NOT move anyone's feet — they only shrink how
  // tall the target is drawn (below), with the bottom (feet) anchored to the same ground line.
  const jShift = (eyeZ(P) - (f.jumpZ || 0)) * hFull * JUMP_SHIFT;
  const yBottom = H/2 + pitch + hFull*EYE_RATIO + hFull*0.04 + jShift;
  const { view, mirror } = facingView(f);
  return { ty, h, w, x0: (W/2) * (1 + tx/ty) - w/2, y0: yBottom - h, pose, view, mirror };
}
const HEAD_V0 = 4, HEAD_V1 = 20;         // head rows in the standing sprite texture
const HEAD_V0_C = 15, HEAD_V1_C = 30;    // head rows in the crouching sprite texture
const HEAD_V0_S = 8, HEAD_V1_S = 22;     // head rows in the sliding sprite texture
function pickTargetDetail(){
  let hit = null, headshot = false, bestD = 1e9;
  for (const f of targetsFor()){
    const s = project(f); if (!s) continue;
    const u = ((P.aim.x - s.x0) * 64 / s.w) | 0;
    const v = ((P.aim.y - s.y0) * 64 / s.h) | 0;
    if (u < 0 || u > 63 || v < 0 || v > 63) continue;
    const mask = s.pose === 'slide' ? MASK_SLIDE[f.kind] : s.pose === 'crouch' ? MASK_CROUCH[f.kind] : MASK[f.kind];
    if (!mask[v*64 + u]) continue;
    const col = Math.max(0, Math.min(W-1, P.aim.x|0));
    if (s.ty > zbuf[col]) continue;
    if (s.ty < bestD){
      bestD = s.ty; hit = f;
      headshot = s.pose === 'slide' ? (v >= HEAD_V0_S && v < HEAD_V1_S)
        : s.pose === 'crouch' ? (v >= HEAD_V0_C && v < HEAD_V1_C)
        : (v >= HEAD_V0 && v < HEAD_V1);
    }
  }
  return { target: hit, headshot };
}
function pickTarget(){ return pickTargetDetail().target; }

/* ============ actions ============ */
const JUMP_V = 9.75, GRAVITY = 27.87, JUMP_SHIFT = 0.2;
const CROUCH_SPEED_MULT = 0.5, CROUCH_DUCK = 0.9, CROUCH_EASE = 10;
const SLIDE_SPEED = 6.5, SLIDE_DURATION = 0.5;
function hitDirFrom(sx, sy){
  const rx = sx - P.x, ry = sy - P.y;
  const rel = Math.atan2(ry, rx), fwd = Math.atan2(P.dy, P.dx);
  return (rel - fwd) * 180 / Math.PI;
}
function doJump(){
  if (!alive || !P.onGround || P.sliding) return;
  P.jumpVel = JUMP_V;
  P.onGround = false;
  P.crouch = false;    // jumping while crouched stands you back up
  beep(200, .08, 'square', .04);
}
function isRunningNow(){
  const shift = keys.ShiftLeft || keys.ShiftRight;
  const moving = keys.KeyW || keys.KeyA || keys.KeyS || keys.KeyD ||
                 keys.ArrowUp || keys.ArrowDown || move.x || move.y;
  return !!(shift && moving);
}
function toggleCrouch(){
  if (!alive || P.sliding) return;
  if (P.crouch){ P.crouch = false; return; } // press again to stand back up
  if (isRunningNow()) startSlide(); else P.crouch = true;
}
function startSlide(){
  P.crouch = false; // sliding is a separate temporary state, not the held crouch
  P.sliding = true;
  P.slideT = SLIDE_DURATION;
  let fwd = 0, str = 0;
  if (keys.KeyW || keys.ArrowUp) fwd += 1;
  if (keys.KeyS || keys.ArrowDown) fwd -= 1;
  if (keys.KeyD) str += 1;
  if (keys.KeyA) str -= 1;
  fwd += move.y; str += move.x;
  let dx = P.dx*fwd + P.px*str, dy = P.dy*fwd + P.py*str;
  const len = Math.hypot(dx, dy);
  if (len < 0.001){ dx = P.dx; dy = P.dy; } else { dx /= len; dy /= len; }
  P.slideDx = dx; P.slideDy = dy;
  beep(150, .18, 'sawtooth', .06);
}
function doReload(){
  if (!alive || P.reload > 0 || P.ammo === P.mag) return;
  P.reload = 1.0; beep(160, .12, 'square', .05);
}
function shoot(){
  if (!alive || P.reload > 0) return;
  if (P.ammo <= 0){ doReload(); return; }
  P.ammo--; P.flash = 0.06; P.kick = 1;
  P.tracer = { x: P.aim.x, y: P.aim.y, t: 0.09 };
  beep(320, .16, 'square', .11);
  if (CFG.mode === 'online') send({type:'shoot'});

  const { target: t, headshot } = pickTargetDetail();
  if (t){
    const mult = headshot ? 2 : 1;
    if (CFG.mode === 'online'){
      t.flash = 0.12; beep(headshot ? 700 : 520, .07, 'triangle', .07);
      send({ type:'hit', to: t.id, dmg: Math.round(12 * mult) });
    } else {
      t.hp -= mult; t.flash = 0.12;
      beep(headshot ? 700 : 520, .07, 'triangle', .07);
      if (t.hp <= 0){
        foes.splice(foes.indexOf(t), 1);
        pts += t.max * 25; beep(120, .3, 'sawtooth', .09);
        if (!foes.length){
          wave++; P.hp = Math.min(100, P.hp + 25); pts += 150;
          setTimeout(() => { if (alive) spawnWave(); }, 900);
        }
      }
    }
  }
  updHUD();
  if (P.ammo === 0) doReload();
}

/* ============ update ============ */
function step(dt){
  if (!alive) return;
  if (firing && P.flash <= 0 && P.ammo > 0 && P.reload <= 0) shoot();

  if (P.reload > 0){
    P.reload -= dt;
    if (P.reload <= 0){ P.reload = 0; P.ammo = P.mag; beep(280,.09,'square',.05); updHUD(); }
  }

  let fwd = 0, str = 0;
  if (keys.KeyW || keys.ArrowUp) fwd += 1;
  if (keys.KeyS || keys.ArrowDown) fwd -= 1;
  if (keys.KeyD) str += 1;
  if (keys.KeyA) str -= 1;
  if (keys.ArrowLeft) rotate(-1.9*dt*CFG.sens);
  if (keys.ArrowRight) rotate(1.9*dt*CFG.sens);
  fwd += move.y; str += move.x;
  const run = (keys.ShiftLeft || keys.ShiftRight) ? 1.3 : 1;

  let vx, vy, bobRate;
  if (P.sliding){
    P.slideT -= dt;
    const k = Math.sqrt(Math.max(0, P.slideT / SLIDE_DURATION));
    const spd = SLIDE_SPEED * k;
    vx = P.slideDx * spd; vy = P.slideDy * spd;
    bobRate = 14;
    if (P.slideT <= 0) P.sliding = false;
  } else {
    const spdMul = P.crouch ? CROUCH_SPEED_MULT : run;
    const sp = 2.1 * spdMul;
    vx = (P.dx*fwd + P.px*str) * sp;
    vy = (P.dy*fwd + P.py*str) * sp;
    bobRate = 9 * (P.crouch ? 0.6 : run);
  }
  const nx = P.x + vx*dt;
  const ny = P.y + vy*dt;
  const r = 0.26;
  if (!solid(nx + Math.sign(nx-P.x)*r, P.y)) P.x = nx;
  if (!solid(P.x, ny + Math.sign(ny-P.y)*r)) P.y = ny;
  if (fwd || str || P.sliding) P.bob += dt * bobRate;

  // ease the visible crouch/slide height toward its target each frame
  const duckTarget = (P.crouch || P.sliding) ? CROUCH_DUCK : 0;
  P.crouchZ += (duckTarget - P.crouchZ) * Math.min(1, dt * CROUCH_EASE);

  // jump arc — visual only, walls stay just as solid mid-air
  P.jumpZ += P.jumpVel * dt;
  P.jumpVel -= GRAVITY * dt;
  if (P.jumpZ <= 0){ P.jumpZ = 0; P.jumpVel = 0; P.onGround = true; }

  if (CFG.mode === 'solo'){
    for (const f of foes){
      if (f.flash > 0) f.flash -= dt;
      const dx = P.x - f.x, dy = P.y - f.y;
      const d = Math.hypot(dx, dy) || 1;
      if (d > 0.85){
        const s = f.spd * dt, ux = dx/d*s, uy = dy/d*s;
        if (!solid(f.x + ux*3, f.y)) f.x += ux;
        if (!solid(f.x, f.y + uy*3)) f.y += uy;
      } else {
        f.atk -= dt;
        if (f.atk <= 0){
          f.atk = 0.8; P.hp -= 7 + wave; P.hurt = 1; P.hurtAngle = hitDirFrom(f.x, f.y);
          beep(90, .2, 'sawtooth', .1); updHUD();
          if (P.hp <= 0){ P.hp = 0; die(); }
        }
      }
    }
  } else {
    for (const r of REMOTES.values()){
      if (r.flash > 0) r.flash -= dt;
      if (r.mmT > 0) r.mmT -= dt;
    }
    netLoop(dt);
  }
  if (P.hurt > 0){
    P.hurt -= dt*2.2;
    const k = Math.max(0, P.hurt);
    el('hit').style.opacity = k*0.9;
    el('hitdir').style.opacity = Math.min(1, k*1.8)*0.95;
    el('hitdir').style.transform = `rotate(${P.hurtAngle||0}deg)`;
    el('hitdirArrow').style.setProperty('--pop', (0.85 + Math.min(1,k*1.8)*0.35).toFixed(2));
    el('hitdirArrow').style.transform =
      `translateX(-50%) perspective(38vmin) rotateX(58deg) scale(var(--pop))`;
  }
  if (P.flash > 0) P.flash -= dt;
  if (P.kick > 0) P.kick -= dt*5;
  if (P.tracer){ P.tracer.t -= dt; if (P.tracer.t <= 0) P.tracer = null; }
}

/* ============ render ============ */
function render(){
  updateAllRemoteInterp();
  const horizon = H/2 + pitch;
  const g = ctx.createLinearGradient(0,0,0,horizon);
  g.addColorStop(0,'#1c2530'); g.addColorStop(1,'#3a4652');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,Math.max(0,horizon));
  const g2 = ctx.createLinearGradient(0,horizon,0,H);
  g2.addColorStop(0,'#3a3226'); g2.addColorStop(1,'#211f1c');
  ctx.fillStyle = g2; ctx.fillRect(0,Math.max(0,horizon),W,H-Math.max(0,horizon));

  for (let x=0; x<W; x++){
    const cx = 2*x/W - 1;
    const rdx = P.dx + P.px*cx, rdy = P.dy + P.py*cx;
    let mx = P.x|0, my = P.y|0;
    const ddx = Math.abs(1/rdx), ddy = Math.abs(1/rdy);
    let sx, sy, sdx, sdy, side = 0;
    if (rdx < 0){ sx = -1; sdx = (P.x - mx) * ddx; } else { sx = 1; sdx = (mx + 1 - P.x) * ddx; }
    if (rdy < 0){ sy = -1; sdy = (P.y - my) * ddy; } else { sy = 1; sdy = (my + 1 - P.y) * ddy; }
    let tile = 0, guard = 0;
    while (guard++ < 200){
      if (sdx < sdy){ sdx += ddx; mx += sx; side = 0; } else { sdy += ddy; my += sy; side = 1; }
      if (mx<0||my<0||mx>=N||my>=N){ tile = 1; break; }
      if (grid[my][mx] > 0){ tile = grid[my][mx]; break; }
    }
    const dist = side === 0 ? (sdx - ddx) : (sdy - ddy);
    zbuf[x] = Math.max(0.01, dist);
    const h = Math.min(H*6, H / dist);
    const y0 = H/2 + pitch - h * (1 - EYE_RATIO) + eyeZ(P) * h * JUMP_SHIFT;
    const c = WALLC[tile] || WALLC[1];
    let sh = Math.min(1, 1.7 / (1 + dist*0.22));
    if (side === 1) sh *= 0.8;
    ctx.fillStyle = `rgb(${c[0]*sh|0},${c[1]*sh|0},${c[2]*sh|0})`;
    ctx.fillRect(x, y0, 1, h);
    ctx.fillStyle = `rgba(0,0,0,${Math.min(.32, dist*0.035)})`;
    ctx.fillRect(x, y0, 1, h);
  }

  const list = targetsFor().map(f => ({f, d:(f.x-P.x)**2 + (f.y-P.y)**2})).sort((a,b) => b.d - a.d);
  for (const {f} of list){
    const s = project(f); if (!s) continue;
    const img = spriteSet(s.pose, s.view, f.flash > 0)[f.kind];
    const start = Math.max(0, Math.floor(s.x0)), end = Math.min(W, Math.ceil(s.x0 + s.w));
    for (let x=start; x<end; x++){
      if (s.ty >= zbuf[x]) continue;
      let u = ((x - s.x0) * 64 / s.w) | 0;
      if (u < 0 || u > 63) continue;
      if (s.mirror) u = 63 - u;
      ctx.drawImage(img, u, 0, 1, 64, x, s.y0, 1, s.h);
    }
  }

  drawGun();
  drawCross();
}

function gunPos(){
  const bob = Math.sin(P.bob)*4*SCALE, bob2 = Math.abs(Math.cos(P.bob))*3*SCALE;
  const k = Math.max(0, P.kick) * 9 * SCALE;
  const j = eyeZ(P) * 10 * SCALE;
  return { gx: W*0.56 + bob, gy: H - 2 + bob2 + k - j, u: H * 0.055 };
}
function drawGun(){
  const { gx, gy, u } = gunPos();
  if (P.tracer){
    ctx.strokeStyle = `rgba(242,181,68,${P.tracer.t/0.09*0.7})`;
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(gx, gy - u*4.9); ctx.lineTo(P.tracer.x, P.tracer.y); ctx.stroke();
  }
  ctx.fillStyle = '#20282e'; ctx.fillRect(gx - u*0.9, gy - u*2.6, u*1.8, u*2.8);
  ctx.fillStyle = '#39454d'; ctx.fillRect(gx - u*0.45, gy - u*4.6, u*0.9, u*2.2);
  ctx.fillStyle = '#161c21'; ctx.fillRect(gx - u*0.2, gy - u*4.8, u*0.4, u*0.5);
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(gx - u*0.9, gy - u*2.6, u*0.5, u*2.8);
  if (P.flash > 0){
    ctx.fillStyle = 'rgba(242,181,68,.92)';
    ctx.beginPath(); ctx.arc(gx, gy - u*4.9, u*(1.1 + Math.random()*0.5), 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.3)'; ctx.fillRect(0,0,W,H);
  }
}
function drawCross(){
  const cx = P.aim.x, cy = P.aim.y, s = Math.max(3, H*0.012), g = s*0.8;
  ctx.fillStyle = P.reload > 0 ? 'rgba(196,70,44,.9)'
                : hovered ? 'rgba(127,176,105,.95)' : 'rgba(200,203,196,.85)';
  ctx.fillRect(cx-1, cy-g-s, 2, s); ctx.fillRect(cx-1, cy+g, 2, s);
  ctx.fillRect(cx-g-s, cy-1, s, 2); ctx.fillRect(cx+g, cy-1, s, 2);
  if (hovered) ctx.fillRect(cx-1, cy-1, 2, 2);
}

/* minimap: own position always; opponent only flashes in briefly after they fire (online mode) */
const mm = el('map'), mc = mm.getContext('2d');
function drawMap(){
  const t = 132 / N;
  mc.clearRect(0,0,132,132);
  mc.fillStyle = 'rgba(10,14,18,.55)'; mc.fillRect(0,0,132,132);
  mc.fillStyle = '#39454d';
  for (let y=0; y<N; y++) for (let x=0; x<N; x++)
    if (grid[y][x] > 0) mc.fillRect(x*t, y*t, t, t);
  if (CFG.mode === 'online'){
    for (const r of REMOTES.values()){
      if (r.mmT > 0 && !r.dead){
        mc.fillStyle = KIND_COLORS[r.kind][0];
        mc.beginPath(); mc.arc(r.x*t, r.y*t, 2.6, 0, 7); mc.fill();
      }
    }
  }
  mc.fillStyle = '#f2b544';
  mc.beginPath(); mc.arc(P.x*t, P.y*t, 2.6, 0, 7); mc.fill();
  mc.strokeStyle = '#f2b544'; mc.lineWidth = 1.4; mc.beginPath();
  mc.moveTo(P.x*t, P.y*t); mc.lineTo((P.x+P.dx*1.6)*t, (P.y+P.dy*1.6)*t); mc.stroke();
}

/* ============ HUD ============ */
function updHUD(){
  el('hpnum').textContent = Math.max(0, Math.round(P.hp));
  el('hpnum').classList.toggle('hurt', P.hp <= 30);
  el('hpfill').style.height = Math.max(0, P.hp) + '%';
  el('hpfill').style.background = P.hp <= 30 ? '#c4462c' : '#f2b544';
  el('ammonum').textContent = P.reload > 0 ? '—' : P.ammo;
  el('ammonum').classList.toggle('empty', P.ammo === 0);
  if (CFG.mode === 'online'){
    el('top').innerHTML = `あなた <b>${P.kills}</b> キル &nbsp;·&nbsp; ${REMOTES.size + 1}人対戦 &nbsp;·&nbsp; ${CFG.target}キル先取`;
    const rows = [{ id:null, label:'あなた', kills:P.kills }];
    for (const r of REMOTES.values()) rows.push({ id:r.id, label:callsign(r.id), kills:r.kills });
    rows.sort((a,b) => b.kills - a.kills);
    el('scoreboard').innerHTML = rows.map(r =>
      `<div${r.id===null?' class="me"':''}>${r.label} ${r.kills}</div>`).join('');
  } else {
    el('top').innerHTML = `区画 <b>${wave}</b> &nbsp;·&nbsp; 残り <b>${foes.length}</b> &nbsp;·&nbsp; <b>${pts}</b>`;
    el('scoreboard').innerHTML = '';
  }
}

/* ============ flow ============ */
const veil = el('veil');
function backToMenu(){
  veil.classList.remove('gone');
  el('title').innerHTML = '<span>地下七層</span>SUBLEVEL 7';
  el('score').textContent = '';
  applyCfg();
  netState = 'idle';
  el('lobby').style.display = 'none';
  el('scoreboard').innerHTML = '';
  REMOTES.clear();
  if (socket){ try{ socket.close(); }catch(e){} socket = null; }
}
function resume(){ alive = true; veil.classList.add('gone'); if (!isTouch) cv.requestPointerLock?.(); }
function resumeOnline(){
  alive = true;
  veil.classList.add('gone');
  el('quit').style.display = 'none';
  if (!isTouch) cv.requestPointerLock?.();
}
function start(){
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
  resetSolo(); updHUD();
  veil.classList.add('gone');
  if (!isTouch) cv.requestPointerLock?.();
}
function over(titleJa, titleEn, text, btn, sub, next){
  alive = false;
  document.exitPointerLock?.();
  el('title').innerHTML = `<span>${titleJa}</span>${titleEn}`;
  el('blurb').innerHTML = text;
  el('go').textContent = btn; el('go').style.display = '';
  el('score').textContent = sub;
  veil.classList.remove('gone');
  el('go').onclick = next;
  el('hit').style.opacity = 0;
  el('hitdir').style.opacity = 0;
}
function pause(){
  if (!alive) return;
  if (CFG.mode === 'online'){
    alive = false;
    document.exitPointerLock?.();
    el('title').innerHTML = '<span>一時停止</span>PAUSED';
    el('blurb').innerHTML = '対戦を一時停止した。感度はここで調整できる。';
    el('score').textContent = scoreboardText();
    el('modefield').style.display = 'none';
    el('netfield').style.display = 'none';
    el('sensfield').style.display = '';
    el('go').textContent = '続ける';
    el('go').style.display = '';
    el('go').onclick = resumeOnline;
    el('quit').style.display = '';
    el('quit').onclick = () => { backToMenu(); };
    veil.classList.remove('gone');
    el('hit').style.opacity = 0;
    el('hitdir').style.opacity = 0;
    return;
  }
  over('一時停止', 'PAUSED', '手を止めた。設定はここで変えられる。', '続ける', `区画 ${wave} ／ ${pts} 点`, resume);
}
function die(){
  foes = [];
  best = Math.max(best, pts);
  over('信号途絶', 'GAME OVER', `区画 ${wave} で倒れた。`, 'もう一度', `${pts} 点 ／ 最高 ${best} 点`, start);
}
function scoreboardText(){
  const rows = [{ label:'あなた', kills:P.kills }];
  for (const r of REMOTES.values()) rows.push({ label:callsign(r.id), kills:r.kills });
  rows.sort((a,b) => b.kills - a.kills);
  return rows.map(r => `${r.label} ${r.kills}`).join(' ／ ');
}
function finishOnline(winnerId){
  alive = false; document.exitPointerLock?.();
  const iwon = winnerId === myId;
  if (iwon) over('決着', 'YOU WIN', `${CFG.target} キル先取した。`, 'メニューへ', scoreboardText(), backToMenu);
  else over('決着', 'YOU LOSE', `${callsign(winnerId)} に ${CFG.target} キル先取された。`, 'メニューへ', scoreboardText(), backToMenu);
}
el('go').onclick = start;
el('gear').onclick = () => { if (alive) pause(); };

/* ============ loop ============ */
let last = performance.now(), mapT = 0;
function frame(now){
  const dt = Math.min(0.05, (now - last)/1000); last = now;
  step(dt);
  render();
  hovered = alive ? pickTarget() : null;
  mapT += dt;
  if (mapT > 0.08){ mapT = 0; drawMap(); if (alive) updHUD(); }
  requestAnimationFrame(frame);
}
buildMaze(Math.random); drawMap();
requestAnimationFrame(frame);
</script>
